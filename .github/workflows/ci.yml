name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly long fuzz, 19:00 UTC.
    - cron: '0 19 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Needed by the rule-backend contract tests.
      - name: Install nftables
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 tcpdump dnsutils

      - name: fmt
        run: cargo fmt --all --check

      # ipstack 1.0.1's build script copies wintun.dll into
      # <target>/<profile>/examples without creating that directory.
      # Cargo used to make it up front; the build-dir layout that is
      # always on since Cargo 1.100 does not, so a cold target dir fails
      # before any of our code compiles. Upstream build.rs is unchanged
      # as of narrowlink/ipstack d02a7b8.
      - name: ipstack build-script directory
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p target/debug/examples

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace build unifies features (vfawn-bin always pulls
      # backend-native), so each engine alone is never compiled unless
      # asked for by name. A backend module that drifts to depend on
      # the other engine's gate breaks the solo configuration silently.
      - name: solo feature configurations
        if: runner.os == 'Linux'
        run: |
          cargo check -p vfawn-stack-user
          cargo check -p vfawn-stack-user --features backend-ipstack
          cargo check -p vfawn-stack-user --features backend-native

      - name: test
        run: cargo test --workspace

      # Device round-trip tests need root to create a TUN interface; they
      # are #[ignore]d so plain `cargo test` skips them everywhere else.
      - name: device tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-device -- --ignored --test-threads=1 --nocapture

      # The darwin batch path's evidence is real routed traffic: the
      # runner's passwordless sudo supplies the route the test adds
      # itself. Prints the packets-per-read ratio the acceptance
      # criterion wants on record.
      - name: darwin batch e2e (root)
        if: runner.os == 'macOS'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-device --test darwin_batch -- --ignored --test-threads=1 --nocapture

      # The C host's whole lifecycle against the cdylib, with the
      # privileges interface creation needs on each platform. The
      # Windows C compile is a manual-verification item; its ABI is
      # covered by the crate tests (header diff, hostile inputs).
      - name: C ABI example (privileged)
        if: runner.os != 'Windows'
        run: |
          cargo build -p vfawn-ffi
          cc crates/vfawn-ffi/examples/c/lifecycle.c \
            -I crates/vfawn-ffi/include -L target/debug -lvfawn_ffi \
            -o /tmp/vfawn-lifecycle
          if [ "$(uname)" = "Darwin" ]; then
            sudo env DYLD_LIBRARY_PATH="$PWD/target/debug" /tmp/vfawn-lifecycle
          else
            sudo env LD_LIBRARY_PATH="$PWD/target/debug" /tmp/vfawn-lifecycle
          fi

      # The darwin acceptance: takeover through the system's own route
      # command, stats while it stands, and a teardown that returns
      # the table.
      - name: macos e2e (root)
        if: runner.os == 'macOS'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn --features backend-native --test macos_e2e -- --ignored --exact --nocapture

      # The Windows acceptance: the runner is administrator, so the
      # embedded driver loads, the adapter appears, routes move
      # through the live tables, a session echoes, and shutdown
      # leaves nothing behind.
      - name: windows e2e (admin)
        if: runner.os == 'Windows'
        run: cargo test -p vfawn --features backend-native --test windows_e2e -- --ignored --nocapture

      # Route backend contract tests need root for netlink and dummy links.
      - name: route backend tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-platform -- --ignored --test-threads=1 --nocapture

      # Nftables backend tests need root for table/chain manipulation.
      - name: nftables backend tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-platform --test linux_nftables -- --ignored --test-threads=1 --nocapture

      # Phase-one end-to-end acceptance: the full instance inside a
      # namespace, asserted with dig, probes and kernel state.
      - name: e2e acceptance (root)
        if: runner.os == 'Linux'
        run: |
          cargo build -p vfawn-bin
          sudo -E env "PATH=$PATH" cargo test -p vfawn --test e2e_linux -- --ignored --exact --test-threads=1 --nocapture

      - name: license gate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licenses
        run: cargo deny check licenses

      - name: line-count report
        run: cargo run -p xtask -- loc

      - uses: actions/upload-artifact@v4
        with:
          name: loc-${{ matrix.os }}
          path: bench/results/loc.json

  fuzz:
    # cargo-fuzz requires nightly and its dependency set must not leak into
    # the product workspace resolution, so it lives in its own job. Pushes
    # get a short pass per target from the committed corpus; the nightly
    # schedule gets a long one.
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-fuzz defaults to musl on Linux, whose C++ runtime
          # needs a cross compiler the runner lacks; gnu it is.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        run: |
          for t in fuzz/fuzz_targets/*.rs; do
            [ -e "$t" ] || continue
            name="$(basename "${t%.rs}")"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              cargo fuzz run "$name" --target x86_64-unknown-linux-gnu -s none -- -max_total_time=900
            else
              cargo fuzz run "$name" --target x86_64-unknown-linux-gnu -s none -- -max_total_time=60
            fi
          done
      - name: Report crashes
        if: failure()
        run: |
          ls -la fuzz/artifacts/ 2>/dev/null || true
