name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly long fuzz, 19:00 UTC.
    - cron: '0 19 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Needed by the rule-backend contract tests.
      - name: Install nftables
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 tcpdump

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # Device round-trip tests need root to create a TUN interface; they
      # are #[ignore]d so plain `cargo test` skips them everywhere else.
      - name: device tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-device -- --ignored --test-threads=1 --nocapture

      # Route backend contract tests need root for netlink and dummy links.
      - name: route backend tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-platform -- --ignored --test-threads=1 --nocapture

      # Nftables backend tests need root for table/chain manipulation.
      - name: nftables backend tests (root)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" cargo test -p vfawn-platform --test linux_nftables -- --ignored --test-threads=1 --nocapture

      - name: license gate
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licenses
        run: cargo deny check licenses

      - name: line-count report
        run: cargo run -p xtask -- loc

      - uses: actions/upload-artifact@v4
        with:
          name: loc-${{ matrix.os }}
          path: bench/results/loc.json

  fuzz:
    # cargo-fuzz requires nightly and its dependency set must not leak into
    # the product workspace resolution, so it lives in its own job. Pushes
    # get a short pass per target from the committed corpus; the nightly
    # schedule gets a long one.
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-fuzz defaults to musl on Linux, whose C++ runtime
          # needs a cross compiler the runner lacks; gnu it is.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        run: |
          for t in fuzz/fuzz_targets/*.rs; do
            [ -e "$t" ] || continue
            name="$(basename "${t%.rs}")"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              cargo fuzz run "$name" --target x86_64-unknown-linux-gnu -s none -- -max_total_time=900
            else
              cargo fuzz run "$name" --target x86_64-unknown-linux-gnu -s none -- -max_total_time=60
            fi
          done
      - name: Report crashes
        if: failure()
        run: |
          ls -la fuzz/artifacts/ 2>/dev/null || true
