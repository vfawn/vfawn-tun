# Dependency license gate.
#
# The product itself is GPL-3.0-or-later (MySQL-style dual licensing: the
# community edition is free software, commercial terms are sold separately).
# Only permissive licenses are accepted from the dependency graph, because
# commercial relicensing requires unencumbered ownership of everything we
# ship. Copyleft or unlicensed dependencies fail the check by construction
# rather than by review discipline.
#
# The project's own crates are listed as explicit exceptions: they carry the
# project license and are exempt from the permissive-only rule. This keeps
# the gate valid unchanged when the crates are eventually published.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[licenses]
version = 2
# Keep the allow list short: add one SPDX id at a time when a dependency
# needs it, and let unused entries warn.
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]

[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-bin"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-core"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-device"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-ffi"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-obs"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-platform"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-route"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "vfawn-stack-mixed"
[[licenses.exceptions]]
