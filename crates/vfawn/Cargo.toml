[package]
name = "vfawn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
ipnet.workspace = true
socket2 = { workspace = true, features = ["all"] }
vfawn-core = { path = "../vfawn-core" }
vfawn-device = { path = "../vfawn-device" }
bytes.workspace = true
vfawn-stack-user = { path = "../vfawn-stack-user", optional = true }
vfawn-route = { path = "../vfawn-route" }
vfawn-wire = { path = "../vfawn-wire", optional = true }
vfawn-platform = { path = "../vfawn-platform" }

[features]
default = ["backend-ipstack"]
backend-ipstack = ["dep:vfawn-stack-user", "vfawn-stack-user/backend-ipstack"]
backend-native = ["dep:vfawn-stack-user", "vfawn-stack-user/backend-native", "dep:vfawn-wire"]

[dev-dependencies]
vfawn-testsuite = { path = "../vfawn-testsuite" }
vfawn-stack-user = { path = "../vfawn-stack-user", features = ["backend-native"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
