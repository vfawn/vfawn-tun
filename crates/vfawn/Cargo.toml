[package]
name = "vfawn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vfawn-core = { path = "../vfawn-core" }
vfawn-device = { path = "../vfawn-device" }
vfawn-stack-user = { path = "../vfawn-stack-user", optional = true }
async-trait = "0.1"

[features]
default = ["backend-ipstack"]
backend-ipstack = ["dep:vfawn-stack-user", "vfawn-stack-user/backend-ipstack"]
