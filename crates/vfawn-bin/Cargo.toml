[package]
name = "vfawn-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vfawn = { path = "../vfawn" }
vfawn-core = { path = "../vfawn-core" }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt", "signal", "macros"] }
ipnet.workspace = true
vfawn-wire = { path = "../vfawn-wire" }
vfawn-platform = { path = "../vfawn-platform" }

[dev-dependencies]
criterion = "0.5"
bytes.workspace = true
vfawn-stack-user = { path = "../vfawn-stack-user", features = ["backend-native"] }
vfawn-testsuite = { path = "../vfawn-testsuite" }

[[bench]]
name = "dispatch"
harness = false
