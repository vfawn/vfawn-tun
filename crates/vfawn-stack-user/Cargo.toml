[package]
name = "vfawn-stack-user"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Termination engine compiled into this crate. Exactly the same contract
# either way; dependencies attach when each engine lands.
backend-ipstack = ["dep:ipstack", "dep:tokio", "dep:bytes", "dep:async-trait"]
backend-native = ["dep:bytes", "dep:vfawn-wire"]

[dependencies]
vfawn-core = { path = "../vfawn-core" }
vfawn-wire = { path = "../vfawn-wire", optional = true }

[dependencies.ipstack]
version = "1.0"
optional = true

[dependencies.tokio]
workspace = true
optional = true
features = ["rt", "sync", "time", "io-util", "macros"]

[dependencies.async-trait]
workspace = true
optional = true

[dependencies.bytes]
workspace = true
optional = true

[dev-dependencies]
vfawn-wire.workspace = true
vfawn-testsuite = { path = "../vfawn-testsuite" }
bytes.workspace = true
