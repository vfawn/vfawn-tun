[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz", "refer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.91"
# Consumed via git for now; the guard stays on until first release.
publish = false
repository = "https://github.com/vfawn/vfawn-tun"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", default-features = false }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
socket2 = "0.5"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
vfawn-wire = { path = "crates/vfawn-wire" }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
pcap-file = "2"
rtnetlink = "0.14"
netlink-packet-route = "0.19"
tun-rs = { version = "2.8", features = ["interruptible"] }
serde_json = "1"
