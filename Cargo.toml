[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.91"
# Consumed via git for now; the guard stays on until first release.
publish = false
repository = "https://github.com/vfawn/vfawn-tun"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", default-features = false }
ipnet = { version = "2", features = ["serde"] }
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
serde_json = "1"
